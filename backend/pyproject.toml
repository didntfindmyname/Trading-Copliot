[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-copilot-backend"
version = "0.1.0"
description = "AI Engineering Copilot backend for quantitative trading engineering workflows"
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24.1.0",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.112.0",
  "greenlet>=3.0.3",
  "httpx>=0.27.0",
  "mcp>=1.9.1,<2.0",
  "orjson>=3.10.7",
  "prometheus-client>=0.20.0",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pypdf>=4.3.1",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "qdrant-client>=1.11.1",
  "redis>=5.0.8",
  "SQLAlchemy>=2.0.32",
  "sqlparse>=0.5.1",
  "structlog>=24.4.0",
  "tenacity>=8.5.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "black>=24.8.0",
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4"]
ignore = ["B008", "E501", "UP046"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
